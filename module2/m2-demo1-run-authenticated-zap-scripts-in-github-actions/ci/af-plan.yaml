# ZAP Automation Framework plan — Globomantics authenticated script scan.
#
# This single file is the "Authenticated context configuration": it declares the
# target scope, the scripted login, the user to scan as, and the custom scripts
# to run — everything a headless, unattended CI run needs, with no GUI.
#
# It is executed headless by ghcr.io/zaproxy/zaproxy:stable in GitHub Actions
# (and locally by the author preflight) with:
#   zap.sh -cmd -autorun /zap/wrk/af-plan.yaml
---
env:
  contexts:
    - name: Globomantics
      urls:
        - "http://app:8000"
      includePaths:
        - "http://app:8000/account/profile.*"
        - "http://app:8000/greet.*"
      authentication:
        method: "script"
        parameters:
          # Script-based auth loads the script by PATH ('script'); the context
          # registers it, so no separate 'script add' job is needed for auth.
          script: "/zap-scripts-py/globomantics-auth.py"
          scriptEngine: "python : jython"
          # Parameter required by the authentication script:
          "Login URL": "http://app:8000/login"
        verification:
          method: "response"
          loggedInRegex: "Signed in as"
          loggedOutRegex: "Please log in first"
      sessionManagement:
        method: "cookie"
      users:
        - name: "alice"
          credentials:
            username: "alice"
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true        # stream progress to the GitHub Actions job log

jobs:
  # The Jython engine and beta rules are installed into ZAP before this plan
  # runs (by the CI step, and by the compose entrypoint for the local preflight),
  # so no addOns job is needed here.

  # 1) Load the custom checks built in Module 1 (the auth script is loaded by
  #    the context above). 'source' is the on-disk path key for this ZAP build.
  - type: script
    parameters:
      action: "add"
      type: "active"
      engine: "python : jython"
      name: "globomantics-active-rule"
      source: "/zap-scripts-py/globomantics-active-rule.py"
  - type: script
    parameters:
      action: "enable"
      name: "globomantics-active-rule"

  - type: script
    parameters:
      action: "add"
      type: "httpsender"
      engine: "ECMAScript : Graal.js"
      name: "globomantics-marker"
      source: "/zap-scripts/globomantics-marker.js"
  - type: script
    parameters:
      action: "enable"
      name: "globomantics-marker"

  # 2) Seed the login-only page INTO the sites tree AS alice, so the active scan
  #    has an authenticated node (carrying the note parameter) to attack. The
  #    scripted auth logs in first, so this reaches the page behind the session.
  - type: requestor
    parameters:
      user: "alice"
    requests:
      - url: "http://app:8000/account/profile?note=seed"
        method: "GET"

  # 3) Run the active scan AS THE AUTHENTICATED USER against the context scope.
  #    The custom Python rule runs here; the JS marker stamps every request.
  #    The policy's default threshold enables every active rule, including the
  #    Script Active Scan Rules plugin (50000) that runs our custom Python rule.
  - type: activeScan
    parameters:
      context: "Globomantics"
      user: "alice"
      maxRuleDurationInMins: 2
      maxScanDurationInMins: 5
    policyDefinition:
      defaultStrength: "medium"
      defaultThreshold: "medium"

  # 4) Write the evidence the job and the author preflight read back.
  - type: report
    parameters:
      template: "traditional-json"
      reportDir: "/zap/wrk"
      reportFile: "globo-ci-report.json"
      reportTitle: "Globomantics authenticated script scan"
