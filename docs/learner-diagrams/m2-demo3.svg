<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="220" viewBox="0 0 1120 220" role="img" aria-labelledby="title desc"><title id="title">CI risk gate four-step learning workflow</title><desc id="desc">Step 1 False Positive filter, step 2 Job order, step 3 Exit code, step 4 Filtered report. Illustrative, not live ZAP output.</desc><rect width="1120" height="220" rx="22" fill="#130F25"/><text x="30" y="54" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">CI risk gate</text><rect x="30" y="87" width="246" height="97" rx="18" fill="#1B1834" stroke="#FF1675" stroke-width="3"/><circle cx="60" cy="117" r="19" fill="#FF1675"/><text x="60" y="124" font-family="Arial,sans-serif" font-weight="700" font-size="19" text-anchor="middle" fill="#130F25">1</text><text x="153" y="155" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#FFFFFF">False Positive filter</text><path d="M 280 135 h 19" stroke="#EBEFF5" stroke-width="3"/><path d="M 290 129 l 10 6 -10 6" fill="none" stroke="#EBEFF5" stroke-width="3"/><rect x="305" y="87" width="246" height="97" rx="18" fill="#1B1834" stroke="#00A3FF" stroke-width="3"/><circle cx="335" cy="117" r="19" fill="#00A3FF"/><text x="335" y="124" font-family="Arial,sans-serif" font-weight="700" font-size="19" text-anchor="middle" fill="#130F25">2</text><text x="428" y="155" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#FFFFFF">Job order</text><path d="M 555 135 h 19" stroke="#EBEFF5" stroke-width="3"/><path d="M 565 129 l 10 6 -10 6" fill="none" stroke="#EBEFF5" stroke-width="3"/><rect x="580" y="87" width="246" height="97" rx="18" fill="#1B1834" stroke="#FFC942" stroke-width="3"/><circle cx="610" cy="117" r="19" fill="#FFC942"/><text x="610" y="124" font-family="Arial,sans-serif" font-weight="700" font-size="19" text-anchor="middle" fill="#130F25">3</text><text x="703" y="155" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#FFFFFF">Exit code</text><path d="M 830 135 h 19" stroke="#EBEFF5" stroke-width="3"/><path d="M 840 129 l 10 6 -10 6" fill="none" stroke="#EBEFF5" stroke-width="3"/><rect x="855" y="87" width="246" height="97" rx="18" fill="#1B1834" stroke="#02E088" stroke-width="3"/><circle cx="885" cy="117" r="19" fill="#02E088"/><text x="885" y="124" font-family="Arial,sans-serif" font-weight="700" font-size="19" text-anchor="middle" fill="#130F25">4</text><text x="978" y="155" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#FFFFFF">Filtered report</text></svg>
