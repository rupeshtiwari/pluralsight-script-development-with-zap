name: Globomantics ZAP quality gate

# Runs the ZAP quality gate headless and lets its exit code decide the build.
# Manual-dispatch only: this job is MEANT to fail when the gate blocks, so it is
# not run on every push. Run it from the Actions tab to see the gate in action.

on:
  workflow_dispatch: {}        # run it on demand from the Actions tab
  push:
    branches:
      - m2-demo3-after
    paths:
      # Keep a fresh covering run whenever the code the hosted-gate proof watches changes on -after, so
      # the run's commit never drifts from the branch HEAD (drift is what made the proof read "covers: no").
      # Mirrors HOSTED_PATHS in the m2-demo3 step script.
      - "demos/module2-demos/m2-demo3-security-quality-gates/ci/**"
      - "demos/module2-demos/m2-demo3-security-quality-gates/scripts/**"
      - "runtime/**"
      - "docker-compose.yaml"
      - ".env"
      - ".github/workflows/zap-quality-gate.yml"

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROJECT_NAME: globo
      APP_BUILD: vulnerable
      # Pinned to the same immutable multi-arch digest as .env (ZAP 2.17.0),
      # so the hosted amd64 runner and the local arm64 stack run the identical
      # image. Verify the pinned digest when updating the ZAP dependency.
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Start the Globomantics app
        run: docker compose up -d --build --wait app

      - name: Run the ZAP quality gate (exit code decides the build)
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/wrk"
          cp demos/module2-demos/m2-demo3-security-quality-gates/ci/gate-plan.yaml "${GITHUB_WORKSPACE}/wrk/gate-plan.yaml"
          chmod -R 0777 "${GITHUB_WORKSPACE}/wrk"
          set +e
          docker run --rm \
            --network "${COMPOSE_PROJECT_NAME}_default" \
            -v "${GITHUB_WORKSPACE}/wrk:/zap/wrk:rw" \
            "${ZAP_IMAGE}" \
            zap.sh -cmd -autorun /zap/wrk/gate-plan.yaml
          GATE_EXIT=$?
          set -e
          echo "=============================================="
          echo " ZAP QUALITY GATE DECISION"
          echo "   thresholds : errorLevel=HIGH  warnLevel=MEDIUM"
          echo "   exit code  : ${GATE_EXIT}   (0 ok · 1 error · 2 warning)"
          if [ "${GATE_EXIT}" = "0" ]; then
            echo "   result     : PASSED — no alert at or above the error threshold"
          else
            echo "   result     : BLOCKED — the gate failed the build"
          fi
          echo "=============================================="
          exit "${GATE_EXIT}"

      - name: Upload the gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: globo-gate-report
          path: wrk/globo-gate-report.json
          if-no-files-found: ignore

      - name: Tear the app down
        if: always()
        run: docker compose down -v --remove-orphans
