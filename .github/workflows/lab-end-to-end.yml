name: Lab end-to-end (real ZAP, -before)

# The automated end-to-end gate, run on the -before branches, the surface we record from. It reproduces
# exactly what the recorder does on camera: bring up the full Globomantics lab on a hosted runner
# (app + postgres + mongo + ZAP 2.17 with its add-ons), AUTHOR the one taught file this clip teaches
# (by copying it in from the matching -after branch, the same git show the AUTHOR THIS FIRST banner
# prints), then run the demo's four real named steps through ./preflight-check. Every step must print
# PASS, and the per-step logs are uploaded as that demo's evidence. No human runs the lab by hand.
#
# Why -before and not -after: -before is what the student switches to and what we record. Authoring the
# taught file here and then passing all four steps proves the real recording flow end to end; a demo
# with no taught file (m1-demo1, m2-demo2) just runs directly.

on:
  push:
    branches:
      - 'm1-demo*-before'
      - 'm2-demo*-before'
  workflow_dispatch: {}

jobs:
  end-to-end:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out this -before demo branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture the immutable workflow checkout source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse --verify HEAD)"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] && [ "${source_sha}" = "${GITHUB_SHA}" ] || { echo "Workflow checkout source mismatch" >&2; exit 1; }
          printf '%s\n' "${source_sha}" > SOURCE.txt

      - name: Author the taught file(s) from the matching -after branch (what the recorder types on camera)
        run: |
          set -euo pipefail
          stem="${GITHUB_REF_NAME%-before}"
          after="${stem}-after"
          git fetch origin "${after}" --quiet
          after_sha="$(git rev-parse --verify "FETCH_HEAD^{commit}")"
          printf '%s\n' "${after_sha}" > AFTER_SHA.txt
          authored=0
          # Any file the -after branch has under demos/ that -before lacks is the on-camera taught artifact.
          for f in $(git diff --name-only "HEAD" "${after_sha}" -- demos/); do
            if [ ! -e "$f" ] && git cat-file -e "${after_sha}:$f" 2>/dev/null; then
              mkdir -p "$(dirname "$f")"
              git show "${after_sha}:$f" > "$f"
              echo "authored (from ${after}): $f"
              authored=$((authored + 1))
            fi
          done
          echo "taught files authored in: ${authored}"
          # Keep the authored state as a separate local commit; it is never pushed.
          # SOURCE.txt identifies the immutable workflow run's base commit, while
          # EXECUTED_HEAD.txt preserves this authored commit as a distinct source identity.
          if [ "${authored}" -gt 0 ]; then
            git config user.name "globo-smoke"
            git config user.email "smoke@globomantics.test"
            git add -A -- demos/
            git commit -q -m "smoke: author the taught file (local only, mirrors the on-camera AUTHOR THIS FIRST beat)"
            echo "committed ${authored} authored file(s) onto the smoke HEAD"
          fi

      - name: Bring up the full lab (app + DBs + ZAP), wait until healthy
        run: HEALTH_TIMEOUT=900 ./lab up

      - name: Run all four demo steps end to end (every step must PASS)
        # Authenticate the GitHub Actions API that the hosted-run proof (m2-demo1, m2-demo3) reads. Without
        # a token the call is anonymous and shares a 60-request/hour budget across all runner IPs, so it is
        # throttled at random and the proof flips red; github.token gives this job the 5000/hour budget.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The runner captures the actual tree after supplying reused prerequisites.
          PREFLIGHT_CI_SOURCE: '1'
          # Export proof before success cleanup restores the recording checkout.
          PREFLIGHT_EVIDENCE_DIR: ${{ runner.temp }}/zap-preflight-evidence
        run: |
          set -euo pipefail
          # The course self-test is one off-camera command: ./preflight-check. Scope it to THIS -before
          # branch's own demo (m1-demo1-before -> --m1d1) so each smoke job verifies exactly its clip.
          sel="--${GITHUB_REF_NAME%-before}"; sel="${sel/-demo/d}"
          echo "Running ./preflight-check ${sel}"
          ./preflight-check "${sel}"

      - name: Upload the per-step evidence (the saved step output)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-evidence-${{ github.ref_name }}
          # the course self-test's evidence + any FAIL log, the per-step logs, plus the gate/producer
          # sub-logs (hidden dirs) so a failure is diagnosable
          path: ${{ runner.temp }}/zap-preflight-evidence/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Show the self-test evidence, gate run log and ZAP boot log if anything failed
        if: failure()
        run: |
          echo "===== course-evidence.txt (the self-test's full per-step output) ====="
          cat course-evidence.txt 2>/dev/null || echo "(no course-evidence.txt)"
          echo "===== FAIL-*.log (the failing demo and step) ====="
          for f in FAIL-*.log; do [ -f "$f" ] && { echo "--- $f ---"; cat "$f"; }; done 2>/dev/null || true
          echo "===== per-step preflight logs ====="
          find demos -path '*/logs/preflight-*.log' -exec sh -c 'echo "--- $1 ---"; cat "$1"' _ {} \; 2>/dev/null || true
          echo "===== gate run.log (if present) ====="
          find demos -path '*/logs/.gate/run.log' -exec cat {} \; 2>/dev/null || true
          echo "===== ZAP boot log ====="
          docker compose logs --tail=200 zap || true

      - name: Tear the lab down
        if: always()
        run: ./lab down || docker compose down -v --remove-orphans

  # After a GREEN smoke run, tell the author repo to resync its evidence + screens from this CI run, so
  # the recorder/narrator/editor pages always show the newest real output (owner "job zero": evidence =
  # latest CI). Needs the COURSE_SYNC_TOKEN secret (a PAT that can repository_dispatch the author repo).
  # If the secret is absent the step is skipped, so forks and the open-source repo stay green.
  notify-author-repo:
    needs: end-to-end
    if: success()
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch the author repo's evidence sync
        env:
          TOKEN: ${{ secrets.COURSE_SYNC_TOKEN }}
          SYNC_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "COURSE_SYNC_TOKEN not set; skipping author-repo sync dispatch"
            exit 0
          fi
          payload="$(python3 -c 'import json, os; print(json.dumps({"event_type": "code-synced", "client_payload": {"branch": os.environ["SYNC_BRANCH"]}}))')"
          if ! curl --fail --silent --show-error --max-time 30 --output /dev/null -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/rupeshtiwari/pluralsight-author-13-script-development-with-zap/dispatches \
            --data "${payload}"; then
            echo "::error::Author repository evidence-sync dispatch failed"
            exit 1
          fi
          echo "dispatched code-synced to the author repo"
