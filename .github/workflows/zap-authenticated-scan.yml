name: Globomantics authenticated ZAP scan

# Runs the Module 1 ZAP scripts headless, as an authenticated user, in CI.
# Proof artifact on screen: this workflow's GitHub Actions job log.

on:
  workflow_dispatch: {}        # run it on demand from the Actions tab
  push:
    paths:
      - "module2/m2-c3/**"
      - ".github/workflows/zap-authenticated-scan.yml"

jobs:
  authenticated-scan:
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROJECT_NAME: globo
      APP_BUILD: vulnerable
      # Pinned to the same immutable multi-arch digest as .env (ZAP 2.17.0),
      # so the hosted amd64 runner and the local arm64 stack run the identical
      # image. Re-verify the digest at recording time per the course outline.
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Start the Globomantics app (Postgres + Mongo + FastAPI)
        run: docker compose up -d --build --wait app

      - name: Run ZAP headless with the Automation Framework plan
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/wrk"
          cp module2/m2-c3/ci/af-plan.yaml "${GITHUB_WORKSPACE}/wrk/af-plan.yaml"
          # ZAP runs as uid 1000 inside the container; make the bind-mounted
          # work dir writable so the report job can write globo-ci-report.json.
          chmod -R 0777 "${GITHUB_WORKSPACE}/wrk"
          # The context uses a Jython auth script, so the python:jython engine
          # must exist BEFORE the plan's env is set up. Install the add-ons in
          # the same container first, then autorun the plan.
          docker run --rm \
            --network "${COMPOSE_PROJECT_NAME}_default" \
            -v "${GITHUB_WORKSPACE}/wrk:/zap/wrk:rw" \
            -v "${GITHUB_WORKSPACE}/module1/m1-c4/zap-scripts:/zap-scripts:ro" \
            -v "${GITHUB_WORKSPACE}/module1/m1-c5/zap-scripts:/zap-scripts-py:ro" \
            --entrypoint bash \
            "${ZAP_IMAGE}" \
            -c "zap.sh -cmd -addoninstall jython -addoninstall ascanrulesBeta \
                && zap.sh -cmd -autorun /zap/wrk/af-plan.yaml"

      - name: Show the authenticated finding from the report
        if: always()
        run: |
          python3 - <<'PY'
          import json, sys, pathlib
          p = pathlib.Path("wrk/globo-ci-report.json")
          if not p.exists():
              print("no report produced"); sys.exit(0)
          data = json.loads(p.read_text())
          alerts = []
          for site in data.get("site", []):
              for a in site.get("alerts", []):
                  alerts.append(a)
          print("Alerts recorded by the authenticated scan:")
          for a in sorted(alerts, key=lambda a: a.get("alert") or a.get("name") or ""):
              name = a.get("alert") or a.get("name")
              mark = "  >>" if "Reflected" in (name or "") else "   -"
              print("%s %s" % (mark, name))
          # Step 4 proof artifact: the authenticated unsafe-reflection finding.
          for a in alerts:
              if "Reflected" in (a.get("alert") or a.get("name") or ""):
                  inst = (a.get("instances") or [{}])[0]
                  base = (inst.get("uri", "") or "").split("?")[0]
                  print("\nAuthenticated finding (Step 4 proof):")
                  print("  Finding:   %s" % (a.get("alert") or a.get("name")))
                  print("  URL:       %s  (reached while logged in as alice)" % base)
                  print("  Parameter: %s" % inst.get("param", ""))
                  break
          PY

      - name: Upload the scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: globo-ci-report
          path: wrk/globo-ci-report.json
          if-no-files-found: ignore

      - name: Tear the app down
        if: always()
        run: docker compose down -v --remove-orphans
