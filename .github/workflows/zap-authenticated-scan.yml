name: Globomantics authenticated ZAP scan

# Runs the Module 1 ZAP scripts headless, as an authenticated user, in CI.
# Proof artifact on screen: this workflow's GitHub Actions job log.

on:
  workflow_dispatch: {}        # run it on demand from the Actions tab
  push:
    paths:
      - "module2/m2-demo1-run-authenticated-zap-scripts-in-github-actions/**"
      - ".github/workflows/zap-authenticated-scan.yml"

jobs:
  authenticated-scan:
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROJECT_NAME: globo
      APP_BUILD: vulnerable
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Start the Globomantics app (Postgres + Mongo + FastAPI)
        run: docker compose up -d --build --wait app

      - name: Run ZAP headless with the Automation Framework plan
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/wrk"
          cp module2/m2-demo1-run-authenticated-zap-scripts-in-github-actions/ci/af-plan.yaml "${GITHUB_WORKSPACE}/wrk/af-plan.yaml"
          # The context uses a Jython auth script, so the python:jython engine
          # must exist BEFORE the plan's env is set up. Install the add-ons in
          # the same container first, then autorun the plan.
          docker run --rm \
            --network "${COMPOSE_PROJECT_NAME}_default" \
            -v "${GITHUB_WORKSPACE}/wrk:/zap/wrk:rw" \
            -v "${GITHUB_WORKSPACE}/module1/m1-demo2-write-a-javascript-security-script-in-zap/zap-scripts:/zap-scripts:ro" \
            -v "${GITHUB_WORKSPACE}/module1/m1-demo3-write-python-scan-and-authentication-scripts-in-zap/zap-scripts:/zap-scripts-py:ro" \
            --entrypoint bash \
            "${ZAP_IMAGE}" \
            -c "zap.sh -cmd -addoninstall jython -addoninstall ascanrulesBeta \
                && zap.sh -cmd -autorun /zap/wrk/af-plan.yaml"

      - name: Show the authenticated custom alert from the report
        if: always()
        run: |
          python3 - <<'PY'
          import json, sys, pathlib
          p = pathlib.Path("wrk/globo-ci-report.json")
          if not p.exists():
              print("no report produced"); sys.exit(0)
          data = json.loads(p.read_text())
          names = []
          for site in data.get("site", []):
              for a in site.get("alerts", []):
                  names.append(a.get("alert") or a.get("name"))
          print("Alerts in the authenticated scan report:")
          for n in sorted(set(names)):
              mark = "  >>" if "Globomantics" in (n or "") else "   -"
              print("%s %s" % (mark, n))
          PY

      - name: Upload the scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: globo-ci-report
          path: wrk/globo-ci-report.json
          if-no-files-found: ignore

      - name: Tear the app down
        if: always()
        run: docker compose down -v --remove-orphans
