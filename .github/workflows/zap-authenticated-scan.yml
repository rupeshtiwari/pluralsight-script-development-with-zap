name: Globomantics authenticated ZAP scan

# Runs the Module 1 ZAP scripts headless, as an authenticated user, in CI.
# The GitHub Actions job log and archived JSON report are the scan evidence.

on:
  workflow_dispatch: {}        # run it on demand from the Actions tab
  push:
    branches:
      - m2-demo1-after
    paths:
      - "demos/module2-demos/m2-demo1-authenticated-zap-github-actions/ci/**"
      - "demos/module2-demos/m2-demo1-authenticated-zap-github-actions/scripts/**"
      - "demos/module1-demos/m1-demo2-javascript-http-sender/zap-scripts/**"
      - "demos/module1-demos/m1-demo3-python-scanning-authentication/zap-scripts/**"
      - "runtime/**"
      - "docker-compose.yaml"
      - ".env"
      - ".github/workflows/zap-authenticated-scan.yml"

jobs:
  authenticated-scan:
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROJECT_NAME: globo
      APP_BUILD: vulnerable
      # Pinned to the same immutable multi-arch digest as .env (ZAP 2.17.0),
      # so the hosted amd64 runner and the local arm64 stack run the identical
      # image. Verify the pinned digest when updating the ZAP dependency.
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Start the Globomantics app (Postgres + Mongo + FastAPI)
        run: docker compose up -d --build --wait app

      - name: Run ZAP headless with the Automation Framework plan
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/wrk"
          cp demos/module2-demos/m2-demo1-authenticated-zap-github-actions/ci/af-plan.yaml "${GITHUB_WORKSPACE}/wrk/af-plan.yaml"
          # ZAP runs as uid 1000 inside the container; make the bind-mounted
          # work dir writable so the report job can write globo-ci-report.json.
          chmod -R 0777 "${GITHUB_WORKSPACE}/wrk"
          # The context uses a Jython auth script, so the python:jython engine
          # must exist BEFORE the plan's env is set up. Install the add-ons in
          # the same container first, then autorun the plan.
          docker run --rm \
            --network "${COMPOSE_PROJECT_NAME}_default" \
            -v "${GITHUB_WORKSPACE}/wrk:/zap/wrk:rw" \
            -v "${GITHUB_WORKSPACE}/demos/module1-demos/m1-demo2-javascript-http-sender/zap-scripts:/zap-scripts:ro" \
            -v "${GITHUB_WORKSPACE}/demos/module1-demos/m1-demo3-python-scanning-authentication/zap-scripts:/zap-scripts-py:ro" \
            --entrypoint bash \
            "${ZAP_IMAGE}" \
            -c "zap.sh -cmd -addoninstall jython -addoninstall ascanrulesBeta \
                && zap.sh -cmd -autorun /zap/wrk/af-plan.yaml"

      - name: Assert the authenticated custom alert (fail-closed proof)
        # NOT `if: always()` — this is the proof gate for M2 C3 Step 4. If the
        # report is missing or the NAMED custom Python alert is absent, the job
        # must fail. A built-in reflected-XSS finding is NOT a substitute.
        run: |
          python3 - <<'PY'
          import json, sys, pathlib
          CUSTOM = "Globomantics unsafe reflection (custom rule)"
          p = pathlib.Path("wrk/globo-ci-report.json")
          if not p.exists():
              print("FAIL: the authenticated scan produced no report"); sys.exit(1)
          try:
              data = json.loads(p.read_text())
          except Exception as e:
              print("FAIL: report is not valid JSON: %s" % e); sys.exit(1)
          alerts = [a for site in data.get("site", []) for a in site.get("alerts", [])]
          print("Alerts recorded by the authenticated scan:")
          for a in sorted(alerts, key=lambda a: a.get("alert") or a.get("name") or ""):
              name = a.get("alert") or a.get("name")
              mark = "  >>" if name == CUSTOM else "   -"
              print("%s %s" % (mark, name))
          # Step 4 proof artifact: the NAMED custom Python alert (fail closed).
          match = next((a for a in alerts if (a.get("alert") or a.get("name")) == CUSTOM), None)
          if match is None:
              print("\nFAIL: the authenticated run did not record the custom alert:")
              print("      %r" % CUSTOM)
              print("      A built-in reflected-XSS finding does not satisfy this proof.")
              sys.exit(1)
          inst = (match.get("instances") or [{}])[0]
          base = (inst.get("uri", "") or "").split("?")[0]
          print("\nAuthenticated custom alert (Step 4 proof):")
          print("  Finding:   %s" % CUSTOM)
          print("  Risk:      %s" % match.get("riskdesc", ""))
          print("  URL:       %s  (reached while logged in as alice)" % base)
          print("  Parameter: %s" % inst.get("param", ""))
          print("\nPASS: named custom alert present in the authenticated report.")
          PY

      - name: Upload the scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: globo-ci-report
          path: wrk/globo-ci-report.json
          if-no-files-found: ignore

      - name: Tear the app down
        if: always()
        run: docker compose down -v --remove-orphans
