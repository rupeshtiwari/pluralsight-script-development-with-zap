name: Student repository structure and syntax

on:
  push:
    branches:
      - main
      - 'm1-demo*'
      - 'm2-demo*'
  workflow_dispatch: {}

jobs:
  static-validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
      - name: Validate shell syntax
        run: find setup runtime demos -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Validate Python syntax
        run: python3 -m compileall -q runtime/app runtime/scripts
      - name: Verify evidence output replay and fail-closed parity
        run: python3 -m unittest discover -s runtime/scripts -p 'test_recording_step.py' -v
      - name: Verify all-branch isolation and review arithmetic
        run: python3 -m unittest discover -s runtime/scripts -p 'test_course_maintenance.py' -v
      - name: Validate Docker Compose wiring
        run: docker compose config --quiet
      - name: Validate branch-aware student project structure
        run: python3 runtime/scripts/check_repository_layout.py
      - name: Validate learner documentation
        run: python3 runtime/scripts/repo_quality_check.py

  before-never-breaks:
    # Hard rule: a student who switches to a -before branch and follows the steps must never hit a
    # break, only the friendly AUTHOR THIS FIRST cue for the one artifact that clip teaches on camera.
    # This guardrail compares every -before against its -after, so it needs all branch refs.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out with full history and all branches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch every branch ref
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Validate that no -before branch can break for a student
        run: python3 runtime/scripts/check_before_never_breaks.py
