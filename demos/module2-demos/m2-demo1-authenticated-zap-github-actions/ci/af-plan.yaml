# ZAP Automation Framework plan — Globomantics authenticated script scan.
#
# This single file is the "Authenticated context configuration": it declares the
# target scope, the scripted login, the user to scan as, and the custom scripts
# to run — everything a headless, unattended CI run needs, with no GUI.
#
# It is executed headless by ghcr.io/zaproxy/zaproxy (pinned digest = tag
# 20260807-stable, ZAP 2.17.0) in GitHub Actions (and locally by the author
# preflight) with:
#   zap.sh -cmd -autorun /zap/wrk/af-plan.yaml
#
# Job sequence (M2 Clip 1 architecture, non-gate portion): this plan follows the
# canonical Automation Framework order taught in the M2 Clip 1 presentation —
#   passiveScan-config -> script -> spider -> passiveScan-wait -> activeScan
#   -> passiveScan-wait -> report
# It deliberately omits the GATE jobs (alertFilter + exitStatus), which belong to
# the M2 Clip 5 gate plan (ci/gate-plan.yaml, EO3c): adding exitStatus here would
# fail this authenticated-scan run by design and contradict M2 Clip 3's
# "job log = success" / "authenticated custom alert record" proof artifacts (EO3a).
---
env:
  contexts:
    - name: Globomantics
      urls:
        - "http://app:8000"
      includePaths:
        - "http://app:8000/account/profile.*"
        - "http://app:8000/greet.*"
      authentication:
        method: "script"
        parameters:
          # Script-based auth loads the script by PATH ('script'); the context
          # registers it, so no separate 'script add' job is needed for auth.
          script: "/zap-scripts-py/globomantics-auth.py"
          scriptEngine: "python : jython"
          # Parameter required by the authentication script:
          "Login URL": "http://app:8000/login"
        verification:
          method: "response"
          loggedInRegex: "Signed in as"
          loggedOutRegex: "Please log in first"
      sessionManagement:
        method: "cookie"
      users:
        - name: "alice"
          credentials:
            username: "alice"
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true        # stream progress to the GitHub Actions job log

jobs:
  # The Jython engine and beta rules are installed into ZAP before this plan
  # runs (by the CI step, and by the compose entrypoint for the local preflight),
  # so no addOns job is needed here.

  # 1) passiveScan-config — turn on passive scanning (scope-limited) before any
  #    traffic, so passive rules observe every request the plan generates.
  - type: passiveScan-config
    parameters:
      scanOnlyInScope: true

  # 2) script — load the custom checks built in Module 1 (the auth script is
  #    loaded by the context above). 'source' is the on-disk path key for this
  #    ZAP build.
  - type: script
    parameters:
      action: "add"
      type: "active"
      engine: "python : jython"
      name: "globomantics-active-rule"
      source: "/zap-scripts-py/globomantics-active-rule.py"
  - type: script
    parameters:
      action: "enable"
      name: "globomantics-active-rule"

  - type: script
    parameters:
      action: "add"
      type: "httpsender"
      engine: "ECMAScript : Graal.js"
      name: "globomantics-marker"
      source: "/zap-scripts/globomantics-marker.js"
  - type: script
    parameters:
      action: "enable"
      name: "globomantics-marker"

  # 3) spider — crawl the authenticated scope AS alice (the scripted login runs
  #    first), so the sites tree is populated from inside the session.
  - type: spider
    parameters:
      context: "Globomantics"
      user: "alice"
      url: "http://app:8000/account/profile?note=seed"
      maxDuration: 1

  # 4) passiveScan-wait — let the passive scan queue drain before the active scan.
  - type: passiveScan-wait
    parameters:
      maxDuration: 2

  # 5) requestor — seed the exact login-only node (carrying the note parameter)
  #    INTO the sites tree AS alice, so the active scan has an authenticated node
  #    to attack even if the spider did not reach this precise URL. This is the
  #    node the custom Python rule inspects.
  - type: requestor
    parameters:
      user: "alice"
    requests:
      - url: "http://app:8000/account/profile?note=seed"
        method: "GET"

  # 6) activeScan — run the active scan AS THE AUTHENTICATED USER against the
  #    context scope. The inline policy enables the Script Active Scan Rules
  #    plugin (50000) at LOW threshold, which routes the scan into our custom
  #    Python rule; the JS marker stamps every request. (This is the
  #    activeScan-policy + activeScan step of the canonical sequence, inline.)
  - type: activeScan
    parameters:
      context: "Globomantics"
      user: "alice"
      maxRuleDurationInMins: 2
      maxScanDurationInMins: 5
    policyDefinition:
      defaultStrength: "medium"
      defaultThreshold: "medium"
      rules:
        - id: 50000          # Script Active Scan Rules — run our custom rule
          strength: "medium"
          threshold: "low"

  # 7) passiveScan-wait — catch passive findings raised by active-scan traffic.
  - type: passiveScan-wait
    parameters:
      maxDuration: 2

  # 8) report — write the evidence the job and the author preflight read back.
  - type: report
    parameters:
      template: "traditional-json"
      reportDir: "/zap/wrk"
      reportFile: "globo-ci-report.json"
      reportTitle: "Globomantics authenticated script scan"
